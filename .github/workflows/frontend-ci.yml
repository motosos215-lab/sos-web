name: Frontend CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting script
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['format:check'] ? 0 : 1)"; then
            npm run format:check
          else
            echo "No format:check script configured; skipping."
          fi

      - name: Check lint script
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['lint'] ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script configured; skipping."
          fi

      - name: Check type-check script
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['type-check'] ? 0 : 1)"; then
            npm run type-check
          else
            echo "No type-check script configured; skipping."
          fi

      - name: Check test script
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test'] ? 0 : 1)"; then
            npm test
          else
            echo "No test script configured; skipping."
          fi

      - name: Build frontend
        run: npm run build
