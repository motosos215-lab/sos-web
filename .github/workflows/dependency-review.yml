name: Dependency Review

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@SHA_REAL_DE_CHECKOUT # v4

      - name: Review dependencies
        uses: actions/dependency-review-action@SHA_REAL_DEPENDENCY_REVIEW # v4
        with:
          fail-on-severity: high
